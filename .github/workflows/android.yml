# The Android APK (phones, tablets, foldables and TVs), on Linux. Runs on a
# push to dev, on a version tag and by hand; the APK is attached to the run,
# and to the release when the run comes from a tag.
#
# The APK is debug-signed (tools/build-android.sh). Android only installs an
# update signed with the same key, and a fresh runner invents a new key every
# time, so set the secret ANDROID_DEBUG_KEYSTORE to a keystore in base64 to
# keep one. Without it the APK works, but won't update an earlier install.
name: Android
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, such as 1.2.1 (empty: the Makefile's)"
        type: string
  push:
    branches: [dev]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "tools/latest-version.py", ".github/workflows/latest-version.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;28.2.13676358" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.1" > /dev/null
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash tools/ci-version.sh
      - name: The signing key, if there is one
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::No ANDROID_DEBUG_KEYSTORE secret: this APK won't update an earlier install."
          fi
      - uses: actions/cache@v4
        with:
          path: |
            .deps/android
            .deps/src
          key: android-${{ hashFiles('tools/build-android-deps.sh', 'tools/build-android-libssh.sh', 'tools/build-android-mhd.sh') }}
      - name: Build
        run: ./tools/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chiral-ftp-${{ env.VERSION }}-android
          path: dist/chiral-ftp-*-android.apk
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/ci-attach-release.sh dist/chiral-ftp-*-android.apk
