# The Linux AppImages, x86_64 and aarch64, built on GitHub's Ubuntu 22.04
# runners (an older glibc than most desktops run, so they start on most
# distributions). Runs on a push to dev and by hand, with the AppImages attached
# to the run; New Release (new-release.yml) runs it to make a release.
name: Linux AppImage
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, such as 1.2.1 (empty: the Makefile's)"
        type: string
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tools/latest-version.py"
      - "tools/release-notes.py"
      - ".github/workflows/latest-version.yml"
      - ".github/workflows/new-release.yml"
# A newer push replaces this build; a release or a run by hand is never replaced.
concurrency:
  group: linux-appimage-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake curl python3 file \
            libsdl2-dev libmicrohttpd-dev libssh-dev libfreetype-dev libfuse2
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash tools/ci-version.sh
      - name: libssh2 and Mbed TLS for the SFTP client
        run: ./tools/build-sftp-deps.sh host
      - name: Build
        run: make PLATFORM=sdl VERSION="$VERSION" -j"$(nproc)"
      - name: AppImage
        run: VERSION="$VERSION" ./tools/make-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chiral-ftp-${{ env.VERSION }}-linux-${{ matrix.arch }}
          path: dist/chiral-ftp-*.AppImage
          if-no-files-found: error
