# The Linux AppImages, x86_64 and aarch64, built on GitHub's Ubuntu 22.04
# runners (an older glibc than most desktops run, so they start on most
# distributions). Runs on a push to dev, on a version tag and by hand; the
# AppImages are attached to the run, and to the release when the run comes
# from a tag.
name: Linux AppImage
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, such as 1.2.1 (empty: the Makefile's)"
        type: string
  push:
    branches: [dev]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "tools/latest-version.py", ".github/workflows/latest-version.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: write
jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake curl python3 file \
            libsdl2-dev libmicrohttpd-dev libssh-dev libfreetype-dev libfuse2
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash tools/ci-version.sh
      - name: libssh2 and Mbed TLS for the SFTP client
        run: ./tools/build-sftp-deps.sh host
      - name: Build
        run: make PLATFORM=sdl VERSION="$VERSION" -j"$(nproc)"
      - name: AppImage
        run: VERSION="$VERSION" ./tools/make-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chiral-ftp-${{ env.VERSION }}-linux-${{ matrix.arch }}
          path: dist/chiral-ftp-*.AppImage
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/ci-attach-release.sh dist/chiral-ftp-*.AppImage
