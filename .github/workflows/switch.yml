# The Switch .nro, in devkitPro's own container. Runs on a push to dev and by
# hand, with the .nro attached to the run; New Release (new-release.yml) runs it
# to make a release.
name: Switch
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, such as 1.2.1 (empty: the Makefile's)"
        type: string
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tools/latest-version.py"
      - "tools/release-notes.py"
      - ".github/workflows/latest-version.yml"
      - ".github/workflows/new-release.yml"
# A newer push replaces this build; a release or a run by hand is never replaced.
concurrency:
  group: switch-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
jobs:
  switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: |
          apt-get update
          apt-get install -y git curl make gcc python3
          dkp-pacman -Sy --noconfirm --needed switch-dev switch-libssh2 switch-mbedtls switch-zlib \
            dkp-toolchain-vars switch-ntfs-3g switch-lwext4
      - uses: actions/checkout@v4
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash tools/ci-version.sh
      - uses: actions/cache@v4
        with:
          path: |
            .deps/switch
            .deps/src
          key: switch-${{ hashFiles('tools/build-switch-deps.sh', 'tools/build-switch-usbhsfs.sh', 'platform/switch/net.c') }}
      - name: Build
        run: make PLATFORM=switch VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: chiral-ftp-${{ env.VERSION }}-switch
          path: dist/chiral-ftp/chiral-ftp.nro
          if-no-files-found: error
