# The Switch .nro, in devkitPro's own container. Runs on a push to dev, on a
# version tag and by hand; the .nro is attached to the run, and to the release
# when the run comes from a tag. Attaching is a job of its own, outside the
# container, because that is where gh is.
name: Switch
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, such as 1.2.1 (empty: the Makefile's)"
        type: string
  push:
    branches: [dev]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "tools/latest-version.py", ".github/workflows/latest-version.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: write
jobs:
  switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: |
          apt-get update
          apt-get install -y git curl make gcc python3
          dkp-pacman -Sy --noconfirm --needed switch-dev switch-libssh2 switch-mbedtls switch-zlib \
            dkp-toolchain-vars switch-ntfs-3g switch-lwext4
      - uses: actions/checkout@v4
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash tools/ci-version.sh
      - uses: actions/cache@v4
        with:
          path: |
            .deps/switch
            .deps/src
          key: switch-${{ hashFiles('tools/build-switch-deps.sh', 'tools/build-switch-usbhsfs.sh', 'platform/switch/net.c') }}
      - name: Build
        run: make PLATFORM=switch VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: chiral-ftp-${{ env.VERSION }}-switch
          path: dist/chiral-ftp/chiral-ftp.nro
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.version }}
  attach:
    if: startsWith(github.ref, 'refs/tags/')
    needs: switch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash tools/ci-version.sh
      - uses: actions/download-artifact@v4
        with:
          name: chiral-ftp-${{ needs.switch.outputs.version }}-switch
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/ci-attach-release.sh chiral-ftp.nro
