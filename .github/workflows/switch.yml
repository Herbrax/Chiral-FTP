# The Switch .nro, in devkitPro's own container. Runs on a push to dev and by
# hand, with the .nro attached to the run; New Release (new-release.yml) runs it
# to make a release.
name: Switch
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, such as 1.2.1 (empty: the Makefile's)"
        type: string
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
      ref:  # what to build, when it isn't what the run started from
        type: string
        default: ""
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tools/latest-version.py"
      - "tools/release-notes.py"
      - ".github/workflows/latest-version.yml"
      - ".github/workflows/new-release.yml"
# A newer push replaces this build; a release or a run by hand is never replaced.
concurrency:
  group: switch-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
jobs:
  switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    defaults:
      run:
        shell: bash
    steps:
      # devkitPro's package server sometimes refuses GitHub's machines (HTTP 403
      # from its Cloudflare). So the packages a run downloads are kept, and the
      # next run installs those rather than asking the server again.
      - uses: actions/cache@v4
        with:
          path: /tmp/dkp-cache
          key: switch-dkp-${{ github.run_id }}
          restore-keys: switch-dkp-
      - name: Packages
        run: |
          apt-get update
          apt-get install -y git curl make gcc python3
          # switch-dev is a group: -Q doesn't know it, -Qg does.
          group="switch-dev"
          pkgs="switch-libssh2 switch-mbedtls switch-zlib dkp-toolchain-vars switch-ntfs-3g switch-lwext4 switch-curl"
          have() { dkp-pacman -Qg $group > /dev/null 2>&1 && dkp-pacman -Q $pkgs > /dev/null 2>&1; }
          mkdir -p /tmp/dkp-cache
          # 1. Already in the image.
          if have; then echo "all in the image"; exit 0; fi
          # 2. The last run's packages, without the server.
          if ls /tmp/dkp-cache/*.pkg.tar.* > /dev/null 2>&1 &&
             dkp-pacman -U --noconfirm --needed /tmp/dkp-cache/*.pkg.tar.* &&
             have; then
            echo "installed from the cache"; exit 0
          fi
          # 3. The server, three times at most.
          for attempt in 1 2 3; do
            dkp-pacman -Sy --noconfirm --needed --cachedir /tmp/dkp-cache $group $pkgs && break
            echo "::warning::pkg.devkitpro.org refused (attempt $attempt)"
            sleep $((attempt * 30))
          done
          dkp-pacman -Q $pkgs && dkp-pacman -Qg $group > /dev/null
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash tools/ci-version.sh
      - uses: actions/cache@v4
        with:
          path: |
            .deps/switch
            .deps/src
          key: switch-${{ hashFiles('tools/build-switch-deps.sh', 'tools/build-switch-usbhsfs.sh', 'platform/switch/net.c') }}
      - name: Build
        run: make PLATFORM=switch VERSION="$VERSION"
      # The file itself, not in a zip; it names the artifact.
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/chiral-ftp/chiral-ftp.nro
          if-no-files-found: error
