<!doctype html>
<!-- The dashboard background (sce_sys/pic0.dds, pic1.dds), rendered at
     3840x2160 by tools/render-background.sh. The PS5 draws the title's name
     and buttons on the left, so the artwork sits on the right. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    font-weight: 500;
    src: url("../fonts/IBMPlexMono-Medium.ttf") format("truetype");
  }
  html, body { margin: 0; width: 3840px; height: 2160px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 1900px 1500px at 74% 46%, #1B1E23 0%, #15171B 45%, #0E0F11 100%);
  }
  .art {
    position: absolute; left: 2240px; top: 330px; width: 1360px;
    display: flex; flex-direction: column; align-items: center;
  }
  .art img { width: 980px; height: 980px; display: block; }
  .wordmark {
    margin-top: 70px;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 500;
    font-size: 210px; letter-spacing: -0.02em; line-height: 1; color: #F5F3EC; white-space: nowrap;
  }
  .wordmark span { color: #D9B65E; }
  .tagline {
    margin-top: 56px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 500;
    font-size: 56px; letter-spacing: -0.01em; color: #8E8A80; white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="art">
    <img src="chiral-ftp-mark.svg" alt="">
    <div class="wordmark">chiral<span>-ftp</span></div>
    <div class="tagline">file manager &amp; FTP for PS5</div>
  </div>
</body>
</html>
